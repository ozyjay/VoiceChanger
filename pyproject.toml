[project]
name = "voicechanger"
version = "0.1.0"
description = "Local Open Day demo for voice effects and FFT visualisation"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Your Name" }]
dependencies = [
    "PySide6",
    "numpy",
    "sounddevice",
]

[dependency-groups]
dev = [
    "pyinstaller>=6,<7",
]

[tool.poetry]
package-mode = false
